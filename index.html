<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Niemiecki – Quiz Partizip II</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 30px;
    max-width: 500px;
}
input {
    width: 100%;
    padding: 8px;
    margin: 6px 0;
    font-size: 16px;
}
button {
    padding: 6px 12px;
    margin: 4px 2px;
    font-size: 14px;
    cursor: pointer;
}
.ok { background: #c8f7c5; }
.bad { background: #f7c5c5; }
#score { font-weight: bold; margin-top: 10px; }
.umlaut button { width: 45px; }
</style>
</head>

<body>

<h2>Podaj formy po niemiecku</h2>

<p id="pl-verb"><b>Czasownik (PL):</b></p>

<label>Bezokolicznik (DE)</label>
<input id="infinitiv" placeholder="np. fahren">

<label>Partizip II</label>
<input id="partizip" placeholder="np. gefahren">

<div class="umlaut">
    <button type="button" onclick="insert('ä')">ä</button>
    <button type="button" onclick="insert('ö')">ö</button>
    <button type="button" onclick="insert('ü')">ü</button>
    <button type="button" onclick="insert('ß')">ß</button>
</div>

<br>
<button type="button" onclick="sprawdz()">Sprawdź</button>
<button type="button" onclick="losuj()">Nowy czasownik</button>

<p id="feedback"></p>
<p id="score">Punkty: 0</p>

<script>
const verbs = [
  {pl:"być", de:"sein", part:"gewesen"},
  {pl:"mieć", de:"haben", part:"gehabt"},
  {pl:"iść", de:"gehen", part:"gegangen"},
  {pl:"jechać", de:"fahren", part:"gefahren"},
  {pl:"przyjść", de:"kommen", part:"gekommen"},
  {pl:"widzieć", de:"sehen", part:"gesehen"},
  {pl:"jeść", de:"essen", part:"gegessen"},
  {pl:"dawać", de:"geben", part:"gegeben"},
  {pl:"brać", de:"nehmen", part:"genommen"},
  {pl:"czytać", de:"lesen", part:"gelesen"}
];

let current;
let score = 0;
// przechowujemy referencję do ostatnio fokusowanego inputa
let lastFocused = null;

function losuj() {
    current = verbs[Math.floor(Math.random() * verbs.length)];
    document.getElementById("pl-verb").innerHTML =
        "<b>Czasownik (PL):</b> " + current.pl;

    ["infinitiv","partizip"].forEach(id => {
        const el = document.getElementById(id);
        el.value = "";
        el.className = "";
    });

    document.getElementById("feedback").innerText = "";
    // ustawiamy fokus na polu infinitiv i zapamiętujemy je
    const inf = document.getElementById("infinitiv");
    inf.focus();
    lastFocused = inf;
}

function sprawdz() {
    let ok = true;

    const inf = document.getElementById("infinitiv");
    const part = document.getElementById("partizip");

    if (inf.value.trim().toLowerCase() === current.de) {
        inf.className = "ok";
    } else {
        inf.className = "bad";
        ok = false;
    }

    if (part.value.trim().toLowerCase() === current.part) {
        part.className = "ok";
    } else {
        part.className = "bad";
        ok = false;
    }

    if (ok) {
        score++;
        document.getElementById("feedback").innerText = "✅ Dobrze!";
    } else {
        document.getElementById("feedback").innerText =
            `❌ Poprawnie: ${current.de} – ${current.part}`;
    }

    document.getElementById("score").innerText = "Punkty: " + score;
}

// wstawia znak do ostatnio fokusowanego inputa na pozycji kursora
function insert(char) {
    const el = lastFocused || document.getElementById("infinitiv");
    if (el && el.tagName === "INPUT") {
        // wstaw w miejsce kursora (selectionStart/End)
        const start = el.selectionStart ?? el.value.length;
        const end = el.selectionEnd ?? el.value.length;
        el.value = el.value.slice(0, start) + char + el.value.slice(end);
        const pos = start + char.length;
        // ustaw kursor po wstawionym znaku
        el.setSelectionRange(pos, pos);
        el.focus();
        lastFocused = el;
    }
}

// ustawiamy nasłuch na inputach, żeby zapamiętać ostatnio fokusowane
["infinitiv","partizip"].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('focus', () => lastFocused = el);
    el.addEventListener('click', () => lastFocused = el);
    // opcjonalnie reagujemy na klikanie, aby lastFocused zawsze był aktualne
});

// start
losuj();
</script>

</body>
</html>
