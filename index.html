<html>
<head>
    <title>Audio Playback Example</title>
    <script>
        let audioContext;
        let oscillators = [];
        let isMuted = false;
        let shuffleQueue = false;
        let audioQueue = [];

        function toggleMute() {
            isMuted = !isMuted;
            oscillators.forEach(osc => {
                if (isMuted) {
                    osc.stop();
                } else {
                    playAudio();
                }
            });
        }

        function shuffleAudioQueue() {
            audioQueue.sort(() => Math.random() - 0.5);
        }

        function playAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            const oscillator = audioContext.createOscillator();
            oscillators.push(oscillator);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
            oscillator.connect(audioContext.destination);
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 1);
            oscillator.onended = () => {
                const index = oscillators.indexOf(oscillator);
                if (index > -1) {
                    oscillators.splice(index, 1);
                }
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            playAudio();
            document.getElementById('muteToggle').addEventListener('click', toggleMute);
            document.getElementById('shuffleButton').addEventListener('click', shuffleAudioQueue);
        });
    </script>
</head>
<body>
    <h1>WebAudio Example</h1>
    <button id="muteToggle">Toggle Mute</button>
    <button id="shuffleButton">Shuffle Queue</button>
</body>
</html>
