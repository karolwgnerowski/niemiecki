<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niemiecki</title>
    <script>
        // Function to shuffle an array using Fisher-Yates algorithm
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Play audio feedback
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let successTone, failTone, newTone;

        function setupSounds() {
            successTone = createTone(440); // A4
            failTone = createTone(349); // F4
            newTone = createTone(523); // C5
        }

        function createTone(frequency) {
            let oscillator = audioContext.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            oscillator.connect(audioContext.destination);
            return oscillator;
        }

        function playSound(tone) {
            tone.start();
            tone.stop(audioContext.currentTime + 0.5); // Play for 0.5 seconds
        }

        // Call this function on success
        function onSuccess() {
            playSound(successTone);
        }

        // Call this function on fail
        function onFail() {
            playSound(failTone);
        }

        // Add your 'losuj()' and 'sprawdz()' functions here
        function losuj() {
            onSuccess(); // Call onSuccess when needed
            // Other functionality...
        }
        
        function sprawdz() {
            onFail(); // Call onFail when needed
            // Other functionality...
        }
    </script>
</head>
<body onload="setupSounds()">
    <h1>Niemiecki Game</h1>
    <!-- Your content here -->
</body>
</html>
